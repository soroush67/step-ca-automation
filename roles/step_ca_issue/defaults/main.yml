---
# Paths as seen *inside* the step-ca container
step_ca_container_certs_dir: /home/step/certs
step_ca_container_secrets_dir: /home/step/secrets

# step_ca_container_name, step_ca_host_certs_dir, step_ca_host_secrets_dir
# and step_ca_provisioner live in inventory/sample/group_vars/step_ca.yml
# (not here) so nginx_tls_site can also read the host paths via hostvars.
step_ca_provisioner: ~

# The provisioner's password. Deliberately NOT passed via -e (that would
# put it in the shell's argv, visible to `ps` on the host for the life of
# the process) - it's read from the STEP_CA_PROVISIONER_PASSWORD
# environment variable instead. Set that env var before running
# ansible-playbook (Jenkins: bind a Secret text credential to it via
# withCredentials; CLI: `STEP_CA_PROVISIONER_PASSWORD=... ansible-playbook ...`).
step_ca_provisioner_password: "{{ lookup('env', 'STEP_CA_PROVISIONER_PASSWORD') }}"

# Re-issue even if a cert already exists on disk for this domain
step_ca_force_reissue: false
