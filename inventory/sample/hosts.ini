[step_ca]
# ansible_connection=local: the Jenkins pipeline (infra-Domain.groovy) runs
# its agent directly on this host, so there's no SSH hop to itself to
# authenticate - tasks here just exec locally as whatever OS user runs the
# Jenkins agent. Delegate_to in nginx_tls_site also inherits this. If you
# ever run this playbook from a *different* controller, drop this var (or
# override it with -e ansible_connection=ssh) so it goes back to real SSH.
192.168.11.4 ansible_connection=local

[nginx_gateway]
192.168.11.2
