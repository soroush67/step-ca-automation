---
# Kept here (not just as role defaults) so nginx_tls_site can read them via
# hostvars[groups['step_ca'][0]] regardless of play/role ordering.
step_ca_host_certs_dir: /home/devops/containerd/volume/app-data/step-ca/certs
step_ca_host_secrets_dir: /home/devops/containerd/volume/app-data/step-ca/secrets

step_ca_container_name: step-ca

step_ca_provisioner: afshin.parhizkari@gmail.com

# The password itself must NOT go here - it's read from the
# STEP_CA_PROVISIONER_PASSWORD environment variable at runtime (see
# roles/step_ca_issue/defaults/main.yml and README.md).
