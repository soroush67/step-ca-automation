---
# Issues (or re-uses) a TLS certificate for `domain` from step-ca on the
# step_ca host, then deploys it to the nginx_gateway host and enables the
# site. One domain per run - see README.md for usage.
#
# Required extra-vars: domain, backend_ip, backend_port
# Requires: --ask-vault-pass (or --vault-password-file) for step_ca_provisioner_password

- name: Issue certificate on step-ca
  hosts: step_ca
  # No become here: this connects via SSH as devops (ansible_user), which
  # already runs docker exec without sudo (docker group membership) and
  # owns step_ca_host_certs_dir/secrets_dir directly - no root needed.
  become: false
  roles:
    - step_ca_issue

- name: Deploy certificate and configure nginx site
  hosts: nginx_gateway
  become: true
  roles:
    - nginx_tls_site
